<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enter Company Name</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #cdeef9 0%, #b8e4f4 45%, #d3ecf5 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 44px 48px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(19,181,234,0.18);
    max-width: 420px;
    width: 90%;
  }
  .logo { width: 70px; margin-bottom: 16px; }
  h1 { font-size: 18px; color: #0b1220; margin: 0 0 6px; }
  p { color: #667085; font-size: 13.5px; margin: 0 0 24px; }
  .xero-detected {
    background: #f2f9fc;
    border: 1px solid #d6eef8;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: #475467;
    margin-bottom: 20px;
    text-align: left;
  }
  .xero-detected span { color: #98A2B3; display:block; font-size:11px; text-transform:uppercase; margin-bottom:2px; }
  label { display: block; text-align: left; font-size: 12.5px; color: #475467; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  input[type=text]:focus { outline: none; border-color: #13B5EA; }
  button {
    width: 100%;
    padding: 13px 20px;
    background: #13B5EA;
    color: white;
    font-weight: 600;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover { background: #0f9bcb; }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/image.png" class="logo" alt="Xero">
    <h1>Name this connection</h1>
    <p>This name will be shown as the "Company" on your summary dashboard.</p>

 

    <form method="post" action="/name-entry">
      <input type="hidden" name="tenant_id" value="{{ tenant_id }}">
      <label>Company / Client Name</label>
      <input type="text" name="display_name" placeholder="e.g. Florin Healthcare" value="{{ tenant_name }}" required autofocus>
      <button type="submit">Continue to Dashboard</button>
    </form>
  </div>
</body>
</html>
