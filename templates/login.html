<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMC Convert - Xero Login</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(circle at top right, rgba(19,181,234,0.08), transparent 30%),
      radial-gradient(circle at bottom left, rgba(99,102,241,0.08), transparent 30%),
      #f8fafc;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    padding: 44px 40px;
    border-radius: 24px;
    border: 1px solid #e4e7ec;
    box-shadow:
      0 10px 30px rgba(16, 24, 40, 0.08),
      0 2px 8px rgba(16, 24, 40, 0.04);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #13B5EA, #3b82f6, #6366f1);
  }

  .logo-wrap {
    width: 200px;
    height: 100px;
    margin: 0 auto 24px;
    border-radius: 18px;
    background: #ffffff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }

  .logo-wrap img {
    width: 200px;
    height: 100px;
    object-fit: contain;
  }

  h1 {
    font-size: 21px;
    color: #101828;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 6px;
  }

  p.sub {
    color: #667085;
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .xero-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 20px;
    background: linear-gradient(90deg, #13B5EA, #2563eb);
    color: white;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.1px;
    border: none;
    border-radius: 12px;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(19,181,234,0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .xero-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 28px rgba(19,181,234,0.32);
  }

  .xero-btn:active {
    transform: translateY(0);
  }

  .xero-btn.loading {
    pointer-events: none;
    opacity: 0.8;
    box-shadow: none;
  }

  .xero-icon {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.45);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .xero-btn.loading .spinner { display: inline-block; }
  .xero-btn.loading .xero-icon { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 20px;
    color: #98A2B3;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #eef2f6;
  }

  .switch-account {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #475467;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .switch-account:hover {
    background: #f9fafb;
    color: #101828;
  }

  .footer-note {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #f2f4f7;
    font-size: 12px;
    color: #98A2B3;
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .card {
      padding: 32px 28px;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="{{ base_path }}/static/image.png" alt="Xero">
    </div>
    <h1>Conversion Summary</h1>
    <p class="sub">Sign in with your Xero account to view your data migration summary.</p>

    <a href="{{ base_path }}/login" class="xero-btn" id="loginBtn">
      <svg class="xero-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="white"/>
        <path d="M12 12l-4-4M12 12l4-4M12 12l-4 4M12 12l4 4" stroke="#13B5EA" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="spinner"></span>
      <span class="btn-label">Login with Xero</span>
    </a>

    <div class="divider">or</div>

    <a href="{{ base_path }}/login?switch_account=true" class="switch-account" id="switchAccountLink">
      Use a different account
    </a>

    <div class="footer-note">
      You'll be redirected to Xero to authorize access. MMC Convert never sees your Xero password.
    </div>
  </div>

<script>
  const loginBtn = document.getElementById('loginBtn');
  const switchAccountLink = document.getElementById('switchAccountLink');

  loginBtn.addEventListener('click', function () {
    if (this.classList.contains('loading')) return; // prevent double submission
    this.classList.add('loading');
    this.querySelector('.btn-label').textContent = 'Redirecting to Xero...';
  });

  switchAccountLink.addEventListener('click', function (e) {
    if (loginBtn.classList.contains('loading')) {
      e.preventDefault();
    }
  });
</script>
</body>
</html>
